name: RetinexFormer_LOL_v1_protocolB
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 42
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: D:/AML_Assignment2/data/LOL-v1/train/high
    dataroot_lq: D:/AML_Assignment2/data/LOL-v1/train/low
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 8
    mini_batch_sizes:
    - 8
    iters:
    - 300000
    gt_size: 128
    gt_sizes:
    - 128
    dataset_enlarge_ratio: 50
    prefetch_mode: null
    meta_info_file: D:/AML_Assignment2/configs/protocol_B/train_meta.txt
  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: D:/AML_Assignment2/data/LOL-v1/train/high
    dataroot_lq: D:/AML_Assignment2/data/LOL-v1/train/low
    io_backend:
      type: disk
    meta_info_file: D:/AML_Assignment2/configs/protocol_B/val_meta.txt
network_g:
  type: RetinexFormer
  in_channels: 3
  out_channels: 3
  n_feat: 40
  stage: 1
  num_blocks:
  - 1
  - 2
  - 2
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
train:
  total_iter: 150000
  warmup_iter: -1
  use_grad_clip: true
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods:
    - 46000
    - 104000
    restart_weights:
    - 1
    - 1
    eta_mins:
    - 0.0003
    - 1.0e-06
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: Adam
    lr: 0.0002
    betas:
    - 0.9
    - 0.999
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
val:
  window_size: 4
  val_freq: 1000.0
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
logger:
  print_freq: 100
  save_checkpoint_freq: 1000.0
  use_tb_logger: false
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
